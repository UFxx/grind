services:
  database:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_net

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT}:8080"
    volumes:
      - backend_logs:/src/logs
      - ./backend/.env:/src/.env:ro
      - ./backend/config.yml:/src/config.yml:ro
    networks:
      - app_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:3000"
    env_file:
      - ./frontend/.env
    networks:
      - app_net

networks:
  app_net:

volumes:
  postgres_data:
  backend_logs:
