            name: 'Intellect'

    SendFeedbackRequestBody:
      value:
        sender: 'Sunsetsavorer'
        rating: 5
        message: 'Great app! I love it!'

  requestBodies:
    TelegramAuth:
      description: 'Request body for Telegram authentication'
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TelegramAuthRequestBody'
          examples:
            base:
              $ref: '#/components/examples/TelegramAuthRequestBody'

    CreateInviteCode:
      description: 'Request body for creating invite code'
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateInviteCodeRequestBody'
          examples:
            base:
              $ref: '#/components/examples/CreateInviteCodeRequestBody'

    CreateActivity:
      description: 'Request body for creating activity'
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateActivityRequestBody'
          examples:
            manually:
              $ref: '#/components/examples/ManuallyCreatedActivityRequestBody'
            ai:
              $ref: '#/components/examples/AICreatedActivityRequestBody'

    SendFeedback:
      description: 'Request body for sending feedback'
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SendFeedbackRequestBody'
          examples:
            base:
              $ref: '#/components/examples/SendFeedbackRequestBody'

  responses:
    EmptySuccess:
      description: 'Success response'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
          examples:
            success:
              $ref: '#/components/examples/EmptySuccessResponse'

    BadRequestError:
      description: 'Something went wrong'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/BadRequestErrorResponse'

    InternalServerError:
      description: 'Internal server error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/InternalServerErrorResponse'

    UnauthorizedError:
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/UnauthorizedErrorResponse'

    ForbiddenError:
      description: 'Forbidden'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/ForbiddenErrorResponse'

    NotFoundError:
      description: 'Not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
