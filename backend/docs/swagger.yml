openapi: '3.0.3'

info:
  title: 'GRIND API'
  version: '0.0.1'

tags:
  - name: 'Auth'
    description: 'Authentication'

paths:
  /auth/telegram:
    post:
      tags: [Auth]
      summary: 'Authenticate via Telegram'
      parameters:
        - $ref: '#/components/parameters/TelegramInitData'
      requestBody:
        $ref: '#/components/requestBodies/TelegramAuth'
      responses:
        '200':
          $ref: '#/components/responses/TelegramAuth'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TelegramInitData:
      name: Authorization
      in: header
      required: true
      schema: { type: string }
      example: 'tma xxxxxxxxxxx'

  schemas:
    SuccessResponse:
      type: object
      properties:
        data:
          nullable: true

    PaginationResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - properties:
            data:
              type: object
              properties:
                current_page: { type: integer }
                next_page: { type: integer }
                limit: { type: integer }
                items:
                  type: array
                  items:
                    nullable: true

    ErrorsResponse:
      type: object
      properties:
        errors:
          type: object
          additionalProperties: { type: string }

    TelegramAuthRequestBody:
      type: object
      properties:
        invite_code: { type: string }

    TelegramAuthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
        - properties:
            data:
              type: object
              properties:
                token: { type: string }

  examples:
    EmptySuccessResponse:
      value:
        data: []

    BadRequestResponse:
      value:
        errors:
          other: 'Something went wrong'

    UnauthorizedResponse:
      value:
        errors:
          other: 'Unauthorized'

    ForbiddenResponse:
      value:
        errors:
          other: 'Forbidden'

    NotFoundResponse:
      value:
        errors:
          other: 'Not found'

    UnprocessableEntityResponse:
      value:
        errors:
          field1: 'field1 is required'
          field2: 'field2 has invalid format'
          field3: 'field3 must be numeric'

    TooManyRequestsResponse:
      value:
        errors:
          other: 'Too many requests'

    TelegramAuthRequestBody:
      value:
        invite_code: 'INVITE12345'

    TelegramAuthResponse:
      value:
        data:
          token: 'xxxxxxxxxxxxxxxxxxxxxxx'

  requestBodies:
    TelegramAuth:
      description: 'Request body for Telegram authentication'
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TelegramAuthRequestBody'
          examples:
            base:
              $ref: '#/components/examples/TelegramAuthRequestBody'

  responses:
    EmptySuccess:
      description: 'Success response'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessResponse'
          examples:
            success:
              $ref: '#/components/examples/EmptySuccessResponse'

    BadRequest:
      description: 'Something went wrong'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/BadRequestResponse'

    Unauthorized:
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/UnauthorizedResponse'

    Forbidden:
      description: 'Forbidden'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/ForbiddenResponse'

    NotFound:
      description: 'Not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/NotFoundResponse'

    UnprocessableEntity:
      description: 'Validation error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/UnprocessableEntityResponse'

    TooManyRequests:
      description: 'Too many request'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorsResponse'
          examples:
            error:
              $ref: '#/components/examples/TooManyRequestsResponse'

    TelegramAuth:
      description: 'Response for Telegram authentication'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TelegramAuthResponse'
          examples:
            success:
              $ref: '#/components/examples/TelegramAuthResponse'
